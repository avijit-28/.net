$kind: http-request
url: "{{baseUrl}}/api/amenities"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "amenityName": "Infinity Pool Access {{$timestamp}}",
      "description": "Private roof pool pass included",
      "iconCode": "pool"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function() { pm.response.to.have.status(201); });
      var json = pm.response.json();
      pm.test('Amenity created with ID', function() {
        pm.expect(json.data.amenityId).to.be.a('number');
      });
    language: text/javascript
order: 2000
