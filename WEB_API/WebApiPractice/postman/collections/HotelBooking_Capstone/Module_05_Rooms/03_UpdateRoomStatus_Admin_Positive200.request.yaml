$kind: http-request
url: "{{baseUrl}}/api/rooms/{{roomId}}/status"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "status": "Available"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
