$kind: http-request
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "WrongPassword123!"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401 Unauthorized', function() { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
