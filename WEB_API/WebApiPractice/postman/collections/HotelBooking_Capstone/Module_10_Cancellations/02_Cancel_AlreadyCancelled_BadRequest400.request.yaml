$kind: http-request
url: "{{baseUrl}}/api/bookings/{{bookingId}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "reason": "Duplicate cancel attempt"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400 Bad Request (Cannot cancel already cancelled booking)', function() {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
