$kind: http-request
url: "{{baseUrl}}/api/rooms/{{roomId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Room details with amenities returned', function() {
        pm.expect(json.data.roomId).to.eql(parseInt(pm.environment.get('roomId')));
        pm.expect(json.data.amenities).to.be.an('array');
      });
    language: text/javascript
order: 2000
