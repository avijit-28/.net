$kind: http-request
url: "{{baseUrl}}/api/users/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Guest {{$timestamp}}",
      "email": "guest_{{$timestamp}}@example.com",
      "password": "Customer@Pass2026!",
      "phoneNumber": "+1-555-{{$randomInt}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function() { pm.response.to.have.status(201); });
      var json = pm.response.json();
      pm.test('User registered successfully', function() {
        pm.expect(json.data.userId).to.be.a('number');
        pm.expect(json.data.email).to.include('@example.com');
      });
    language: text/javascript
order: 5000
