$kind: http-request
url: "{{baseUrl}}/api/bookings/{{bookingId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "reason": "Schedule changed plans"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Cancellation breakdown: >48 hours = 100% refund', function() {
        pm.expect(json.data.refundPercentage).to.eql(100);
        pm.expect(json.data.cancellationCharge).to.eql(0);
        pm.expect(json.data.refundAmount).to.be.above(0);
      });
    language: text/javascript
order: 1000
