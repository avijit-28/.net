$kind: http-request
url: "{{baseUrl}}/api/users/{{customerUserId}}"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('User Profile data present', function() {
        pm.expect(json.data.email).to.be.a('string');
      });
    language: text/javascript
order: 4000
