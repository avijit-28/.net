$kind: http-request
url: "{{baseUrl}}/api/rooms/{{roomId}}/amenities"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "amenityIds": [1, 2, 3]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
