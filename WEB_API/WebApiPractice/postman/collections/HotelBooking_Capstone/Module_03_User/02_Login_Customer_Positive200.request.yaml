$kind: http-request
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Customer token received', function() {
        pm.expect(json.data.token).to.be.a('string');
        pm.expect(json.data.role).to.eql('Customer');
        pm.environment.set('customerToken', json.data.token);
        pm.environment.set('customerUserId', json.data.userId);
      });
    language: text/javascript
order: 2000
