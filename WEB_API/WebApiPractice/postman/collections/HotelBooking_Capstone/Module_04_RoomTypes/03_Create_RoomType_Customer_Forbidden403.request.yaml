$kind: http-request
url: "{{baseUrl}}/api/room-types"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "typeName": "Hacker Suite",
      "description": "Should not be allowed",
      "basePrice": 10.00,
      "maxOccupancy": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403 Forbidden', function() { pm.response.to.have.status(403); });
    language: text/javascript
order: 3000
