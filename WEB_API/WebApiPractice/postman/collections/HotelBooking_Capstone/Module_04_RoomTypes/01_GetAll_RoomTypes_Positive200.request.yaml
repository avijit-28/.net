$kind: http-request
url: "{{baseUrl}}/api/room-types"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', function() { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test('Room types array returned', function() {
        pm.expect(json.data).to.be.an('array');
        if (json.data.length > 0) {
          pm.environment.set('roomTypeId', json.data[0].roomTypeId);
        }
      });
    language: text/javascript
order: 1000
